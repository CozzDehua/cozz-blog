<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="theme-color" content="#f8fafc">
  <title>{{ page.title | escape }} | Cozz.</title>
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  <script src="{{ '/assets/blog.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main" data-zh="跳转到正文">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Cozz. Blog">Cozz<span>.</span></a>
    <nav aria-label="Navigation" data-zh-label="导航">
      <a href="{{ '/' | relative_url }}" data-zh="博客">Blog</a>
      <a href="{{ site.homepage }}" data-zh="个人主页">Homepage</a>
      <div class="language-switch" role="group" aria-label="Language" hidden>
        <button type="button" data-language="en" aria-pressed="true" aria-label="Switch interface to English">EN</button>
        <span aria-hidden="true">/</span>
        <button type="button" data-language="zh" aria-pressed="false" aria-label="切换界面为中文">中文</button>
      </div>
    </nav>
  </header>
  <main id="main" tabindex="-1">{{ content }}</main>
  <footer class="site-footer">
    <span>© Cozz. / Chengzong Xie</span>
    <div><a href="{{ '/publishing/' | relative_url }}" data-zh="发布指南">Publishing guide</a> · <a href="https://github.com/{{ site.repository }}/upload/main/_posts" target="_blank" rel="noopener noreferrer" data-zh="上传 Markdown ↗">Upload Markdown ↗</a></div>
  </footer>
  <div class="sr-only" id="language-status" role="status" aria-live="polite"></div>
</body>
</html>
